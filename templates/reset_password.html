{% extends "base.html" %}
{% block title %}Reset Password · {{ site_name }}{% endblock %}

{% block content %}
<section class="auth panel">
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Choose a new password</h1>
    <p class="muted">Create a new password for your account.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="password">New password</label>
        <input id="password" type="password" name="password"
               minlength="10" autocomplete="new-password"
               placeholder="At least 10 characters" required>

        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" type="password"
               name="confirm_password" minlength="10"
               autocomplete="new-password"
               placeholder="Enter the password again" required>

        <button class="primary full" type="submit">
            Update Password
        </button>
    </form>
</section>
{% endblock %}
